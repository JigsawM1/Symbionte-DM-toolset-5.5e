name: CI - Integración Continua

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificacion-calidad:
    name: Verificación de Calidad y Compilación
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node.js (v20) con caché de pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Instalar Dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificación Estricta de Tipos (TypeScript)
        run: pnpm exec tsc --noEmit

      - name: Análisis Estático de Código (ESLint)
        run: pnpm run lint

      - name: Ejecución de Pruebas Automatizadas (Vitest)
        run: pnpm run test

      - name: Simulación de sincronización de 6 PJ y 20 monstruos
        run: pnpm run test:sync-simulacion

      - name: Auditoría de Tamaño de Archivos y Prevención de Monolitos
        run: pnpm run verificar:lineas

      - name: Interacciones del Constructor de Rasgos en Navegador
        run: pnpm run test:rasgos-ui

      - name: Compilación y Empaquetado de Producción (Vite Build)
        run: pnpm exec vite build
